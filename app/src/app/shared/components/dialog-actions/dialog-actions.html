<p-button
  label="Cancel"
  size="small"
  severity="secondary"
  [outlined]="true"
  [disabled]="busy()"
  (onClick)="cancelled.emit()"
/>
<p-button
  [label]="confirmLabel()"
  [icon]="confirmIcon()"
  size="small"
  [disabled]="confirmDisabled()"
  [loading]="busy()"
  (onClick)="confirmed.emit()"
/>
