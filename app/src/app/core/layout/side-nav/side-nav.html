<nav class="side-nav" aria-label="Main">
  <div class="main">
    <app-side-nav-banner />
    <p-menu class="app-bare-menu nav-menu" [model]="mainItems">
      <ng-template #item let-item>
        <app-side-nav-link [item]="navItem(item)" [collapsed]="collapsed()" />
        @if (navItem(item).path === '/phases' && inPhases()) {
          <app-side-nav-phase-tree [collapsed]="collapsed()" />
        }
      </ng-template>
    </p-menu>
  </div>
  <div class="footer">
    <p-menu class="app-bare-menu nav-menu" [model]="footerItems">
      <ng-template #item let-item>
        <app-side-nav-link [item]="navItem(item)" [collapsed]="collapsed()" />
      </ng-template>
    </p-menu>
    <app-api-status class="status" [compact]="collapsed()" />
  </div>
</nav>
