<header class="app-header">
  <div class="start">
    <p-button
      icon="pi pi-bars"
      [text]="true"
      severity="contrast"
      styleClass="nav-toggle"
      [ariaLabel]="sideNavCollapsed() ? 'Expand navigation' : 'Collapse navigation'"
      [attr.aria-expanded]="!sideNavCollapsed()"
      (onClick)="toggleSideNav()"
    />
    <a class="brand" routerLink="/">
      <i class="pi pi-file-edit" aria-hidden="true"></i>
      <span>PU Spec Sheet</span>
    </a>
  </div>
  <app-api-status />
</header>
