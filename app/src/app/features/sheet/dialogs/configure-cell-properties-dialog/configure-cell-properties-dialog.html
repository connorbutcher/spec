<app-dialog-header headerText="Configure Cells" />

<div class="dialog-content">
  <p-message class="px-message-no-animation" severity="info">
    The following cells being added require additional configuration.
    <br />
    These properties can be modified by clicking the settings icon in the table
    header.
  </p-message>

  <div class="cell-properties-configuration">
    @for (cellProperty of cellProperties(); track $index) {
      <app-manage-cell-properties
        [cellProperty]="cellProperty"
        [expandByDefault]="!!$first"
      />
    }
  </div>
</div>

<div class="dialog-actions">
  <button pButton (click)="close()" severity="secondary">Close</button>
  <button pButton (click)="saveConfiguration()" [disabled]="!isValid()">
    Save Configuration
  </button>
</div>
