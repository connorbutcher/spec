<div class="cell-to-configure">
  <div class="ctc-header" (click)="toggleExpansion()">
    <div class="ctc-header-left">
      <span class="ctc-header-title">{{
        cellProperty().tableCellType!.title
      }}</span>
      <span class="ctc-header-subtext">{{
        cellProperty().tableCellType!.description
      }}</span>
    </div>

    <div class="ctc-header-right">
      <p-tag
        [severity]="cellProperty().isValid() ? 'success' : 'danger'"
        [value]="cellProperty().isValid() ? 'Complete' : 'Configuration Needed'"
      />
      <i class="material-symbols-outlined">{{
        isExpanded() ? "expand_more" : "expand_less"
      }}</i>
    </div>
  </div>

  <div class="ctc-content">
    <ng-container #propertyContent></ng-container>
  </div>
</div>
