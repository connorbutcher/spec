<div class="group-container">
  <div></div>

  <app-text-cell-type
    [table]="table()"
    [cell]="cell()"
    [group]="group()"
    [row]="row()"
  />

  <div class="group-actions">
    <button
      pButton
      iconOnly
      class="px-button-xsmall"
      severity="danger"
      size="small"
      [text]="true"
      [disabled]="!canEdit()"
      pTooltip="Delete Group"
      [tooltipDisabled]="!canEdit()"
      (click)="deleteGroup()"
    >
      <i class="pi pi-times"></i>
    </button>

    <button
      pButton
      class="px-button-xsmall"
      severity="contrast"
      [text]="true"
      [disabled]="!canEdit()"
      pTooltip="Add Row"
      [tooltipDisabled]="!canEdit()"
      (click)="op.toggle($event)"
    >
      <i class="pi pi-plus"></i>
    </button>
  </div>
</div>

<p-popover #op>
  <ng-template #content>
    <app-table-add-options
      [table]="table()"
      [parentGroup]="group()"
      [options]="addOptions()"
    />
  </ng-template>
</p-popover>
