<div class="table-layout-container horizontal size-normal border-red">
  <app-table-header [table]="table()" />

  <div class="table-wrapper">
    <div class="pu-spec-sheet-table">
      <div
        class="grid-table-horizontal"
        [style.grid-template-columns]="columnDefinitionString()"
        cdkDropList
        cdkDropListGroup
        (cdkDropListDropped)="drop($event)"
        [cdkDropListData]="table().groups()"
        [cdkDropListDisabled]="!canEdit() || !table().canUserEdit"
        cdkDropListOrientation="horizontal"
        cdkDropListLockAxis="x"
      >
        @for (group of groups(); track group) {
          <div
            app-table-group-horizontal
            [table]="table()"
            [group]="group"
            [parentGroup]="group"
            [rebuildVersion]="rebuildVersion()"
            [cdkDragDisabled]="
              !canEdit() || !group.tableGroupTemplate()?.canBeReordered
            "
            [cdkDragData]="group"
            [cdkDropListDisabled]="!canEdit()"
            [cdkDropListData]="table().groups()"
            cdkDropListOrientation="horizontal"
            cdkDropListLockAxis="x"
            [allowRowReordering]="true"
            [gridArea]="
              '1 / 1 / span ' +
              group.rows().length +
              ' / span ' +
              table().columnDefinitions().count
            "
          ></div>
        }
      </div>
    </div>
  </div>
</div>
