<div id="spec-sheet-toolbar">
  <div class="toolbar-tools">
    <app-spec-sheet-search />
    <div class="toolbar-status">
      <app-advisory-overview />
      <app-references-button />

      <app-sheet-checkout-status />

      @if (specSheet().requiresApprovalWorkflow) {
        <app-sheet-approval-status />
      }
    </div>
  </div>

  <div class="toolbar-actions">
    @if (canEdit() && tableTypes() && tableTypes().length > 0) {
      @if (tableTypes().length === 1) {
        <button
          pButton
          severity="secondary"
          [text]="true"
          (click)="addTable()"
          [disabled]="!canEdit()"
          size="small"
        >
          <i class="pi pi-plus"></i>
          Add Table
        </button>
      } @else {
        <p-splitbutton
          size="small"
          label="Add Table"
          icon="pi pi-plus"
          severity="secondary"
          [text]="true"
          (onClick)="addTable()"
          [model]="tableOptions()"
          [disabled]="!canEdit()"
        />
      }
    }

    @if (canEdit()) {
      @if (canUndoMine()) {
        <button
          pButton
          severity="secondary"
          [text]="true"
          (click)="undoMineAsync()"
          size="small"
          pTooltip="Throw away every change you have checked out on this sheet, and free those rows and tables"
          tooltipPosition="bottom"
        >
          <i class="pi pi-undo"></i>
          Undo My Changes
        </button>
      }

      <button
        pButton
        severity="success"
        [outlined]="true"
        (click)="publishSpecSheetAsync()"
        [disabled]="!isValid() || hasChanges() || !canPublish()"
        size="small"
        [pTooltip]="
          specSheet().requiresApprovalWorkflow
            ? 'Send the changes you have checked out for approval'
            : 'Publish the changes you have checked out as the next version'
        "
        tooltipPosition="bottom"
      >
        <i class="pi pi-upload"></i>
        {{ specSheet().requiresApprovalWorkflow ? "Submit" : "Publish" }}
      </button>

      <button
        pButton
        (click)="saveChangesAsync()"
        [disabled]="!isValid() || !hasChanges()"
        size="small"
        severity="secondary"
      >
        <i class="pi pi-save"></i>
        Save Changes
      </button>
    }
  </div>
</div>
