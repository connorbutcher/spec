<div
  class="approval-status"
  [class.approval-status--required]="!!submissionToDecide()"
>
  <button
    pButton
    [severity]="approvalStatus().severity"
    [text]="true"
    size="small"
    (click)="viewApprovalStatus()"
    pTooltip="View approval status"
    tooltipPosition="bottom"
  >
    <i class="pi pi-check-square"></i>
    {{ approvalStatus().label }}
  </button>

  @if (submissionToDecide()) {
    <button
      pButton
      size="small"
      severity="success"
      (click)="updateStateAsync(true)"
      [pTooltip]="'Approve ' + decideTooltip()"
      tooltipPosition="bottom"
    >
      <i class="pi pi-check"></i>
      Approve
    </button>
    <button
      pButton
      size="small"
      severity="danger"
      [outlined]="true"
      (click)="updateStateAsync(false)"
      [pTooltip]="'Reject ' + decideTooltip()"
      tooltipPosition="bottom"
    >
      <i class="pi pi-times"></i>
      Reject
    </button>
  }
</div>
