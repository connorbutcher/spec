@if (table()) {
  <div class="table-layout-container horizontal">
    <app-sheet-table-header-comparison
      [table]="table()"
      [tableState]="tableComparison().tableState"
    />

    <div class="table-wrapper">
      <div class="pu-spec-sheet-table">
        <div
          class="grid-table-horizontal"
          [style.grid-template-columns]="columnDefinitionString()"
        >
          <ng-container #gridContent></ng-container>
        </div>
      </div>
    </div>
  </div>
} @else {
  <div class="missing-table missing-repeat-background"></div>
}
