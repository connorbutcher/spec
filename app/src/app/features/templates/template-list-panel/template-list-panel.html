<aside class="app-card list-panel" aria-labelledby="template-list-heading">
  <header class="panel-head">
    <h2 id="template-list-heading" class="app-eyebrow">Tables by sheet</h2>
  </header>

  <div class="panel-body">
    @if (hasError()) {
      <app-empty-state
        icon="pi-exclamation-circle"
        title="Couldn't load templates"
        message="Check the API is running, then try again."
      >
        <p-button label="Try again" size="small" [outlined]="true" (onClick)="retry()" />
      </app-empty-state>
    } @else if (isLoading()) {
      <p class="app-note loading">Loading…</p>
    } @else {
      <p-listbox
        class="templates"
        [options]="groups()"
        [group]="true"
        optionGroupLabel="label"
        optionGroupChildren="items"
        optionLabel="name"
        optionValue="id"
        [ngModel]="selectedTemplateId()"
        (onChange)="open($event)"
        ariaLabel="Tables by sheet type"
        emptyMessage="No sheet types yet."
        [fluid]="true"
      >
        <ng-template #group let-group>
          <app-template-list-group-head
            [group]="group"
            [disabled]="isSaving()"
            (added)="add(group)"
          />
        </ng-template>
        <ng-template #item let-template>
          <app-template-list-item [template]="template" />
        </ng-template>
      </p-listbox>
    }
  </div>

  <footer class="panel-foot">
    <p-button
      styleClass="cell-types"
      icon="pi pi-th-large"
      [label]="'Cell types (' + cellTypeCount() + ')'"
      size="small"
      [severity]="isShowingCellTypes() ? 'primary' : 'secondary'"
      [text]="!isShowingCellTypes()"
      [fluid]="true"
      (onClick)="openCellTypes()"
    />
  </footer>
</aside>
