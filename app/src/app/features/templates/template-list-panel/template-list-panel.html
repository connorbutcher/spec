<aside class="app-card list-panel" aria-labelledby="template-list-heading">
  <header class="panel-head">
    <h2 id="template-list-heading">Tables by sheet</h2>
  </header>

  <div class="panel-body">
    @if (hasError()) {
      <app-empty-state
        icon="pi-exclamation-circle"
        title="Couldn't load templates"
        message="Check the API is running, then try again."
      >
        <p-button label="Try again" size="small" [outlined]="true" (onClick)="retry()" />
      </app-empty-state>
    } @else if (isLoading()) {
      <p class="loading">Loading…</p>
    } @else {
      <p-listbox
        class="templates"
        [options]="groups()"
        [group]="true"
        optionGroupLabel="label"
        optionGroupChildren="items"
        optionLabel="name"
        optionValue="id"
        [ngModel]="selectedTemplateId()"
        (onChange)="open($event)"
        ariaLabel="Tables by sheet type"
        emptyMessage="No sheet types yet."
        [fluid]="true"
      >
        <ng-template #group let-group>
          <span class="group-head">
            <i class="pi" [class]="group.icon" aria-hidden="true"></i>
            <span class="name">{{ group.label }}</span>
            <p-button
              icon="pi pi-plus"
              size="small"
              severity="secondary"
              [text]="true"
              [disabled]="isSaving()"
              [ariaLabel]="'Add a table to ' + group.label"
              pTooltip="Add a table"
              (onClick)="add(group, $event)"
            />
          </span>
        </ng-template>
        <ng-template #item let-template>
          <span class="template">
            <i
              class="pi"
              [class.pi-arrows-h]="template.orientation === 'Horizontal'"
              [class.pi-arrows-v]="template.orientation === 'Vertical'"
              aria-hidden="true"
            ></i>
            <span class="name">{{ template.name }}</span>
            <span class="version">v{{ template.latestVersionNumber }}</span>
          </span>
        </ng-template>
      </p-listbox>
    }
  </div>

  <footer class="panel-foot">
    <p-button
      styleClass="cell-types"
      icon="pi pi-th-large"
      [label]="'Cell types (' + cellTypeCount() + ')'"
      size="small"
      [severity]="isShowingCellTypes() ? 'primary' : 'secondary'"
      [text]="!isShowingCellTypes()"
      [fluid]="true"
      (onClick)="openCellTypes()"
    />
  </footer>
</aside>
