<p-tree
  class="app-compact-tree tree"
  [value]="nodes()"
  selectionMode="single"
  [selection]="selected()"
  [filter]="true"
  filterBy="label"
  filterMode="lenient"
  filterPlaceholder="Find a section, row or cell"
  [draggableNodes]="canEdit()"
  [droppableNodes]="canEdit()"
  draggableScope="structure"
  droppableScope="structure"
  [validateDrop]="true"
  (onNodeSelect)="open($event)"
  (onNodeExpand)="expanded($event)"
  (onNodeCollapse)="collapsed($event)"
  (onNodeDrop)="drop($event)"
  (keydown)="keydown($event)"
  ariaLabel="Table structure"
>
  <ng-template #node let-node>
    <span class="node" (contextmenu)="openMenu($event, node)">
      <i [class]="icon(node)" aria-hidden="true"></i>
      <span class="name">{{ node.label }}</span>
      @if (node.data?.meta) {
        <span class="meta">{{ node.data.meta }}</span>
      }
      <span class="actions">
        @if (addAction(node); as action) {
          <p-button
            icon="pi pi-plus"
            size="small"
            severity="secondary"
            [text]="true"
            [disabled]="action.disabled"
            [ariaLabel]="action.label"
            [pTooltip]="action.label"
            tooltipPosition="top"
            [showDelay]="400"
            (onClick)="add(action, $event)"
          />
        }
        @if (node.data?.ref) {
          <p-button
            icon="pi pi-ellipsis-h"
            size="small"
            severity="secondary"
            [text]="true"
            [ariaLabel]="'More for ' + node.label"
            (onClick)="openMenu($event, node)"
          />
        }
      </span>
    </span>
  </ng-template>
</p-tree>
