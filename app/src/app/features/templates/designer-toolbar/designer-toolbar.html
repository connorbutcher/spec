<div class="toolbar">
  <span class="name">{{ template().name }}</span>

  <p-select
    [options]="versionOptions()"
    optionLabel="label"
    optionValue="value"
    [ngModel]="template().versionNumber"
    (onChange)="showVersion($event)"
    size="small"
    ariaLabel="Version"
    appendTo="body"
  />

  <p-selectbutton
    [options]="orientations"
    optionLabel="label"
    optionValue="value"
    [ngModel]="template().orientation"
    (onChange)="setOrientation($event)"
    [allowEmpty]="false"
    [disabled]="isSaving() || !canEdit()"
    size="small"
    ariaLabel="Orientation"
  />

  @if (!template().isEditable) {
    <span class="readonly">Read-only</span>
    @if (isLatest()) {
      <p-button
        label="New version"
        size="small"
        severity="secondary"
        [outlined]="true"
        [disabled]="isSaving()"
        (onClick)="createVersion()"
      />
    } @else {
      <p-button
        label="Open latest"
        size="small"
        severity="secondary"
        [outlined]="true"
        (onClick)="showLatest()"
      />
    }
  }

  <span class="status" aria-live="polite">{{ isSaving() ? 'Saving…' : '' }}</span>
</div>
