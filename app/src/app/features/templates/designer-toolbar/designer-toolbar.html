<div class="toolbar">
  <p-button
    icon="pi pi-table"
    [label]="template().name"
    size="small"
    [severity]="isTemplateOpen() ? 'primary' : 'secondary'"
    [text]="!isTemplateOpen()"
    styleClass="name"
    (onClick)="openSettings()"
  />

  <p-select
    [options]="versionOptions()"
    optionLabel="label"
    optionValue="value"
    [ngModel]="template().versionNumber"
    (onChange)="showVersion($event)"
    size="small"
    ariaLabel="Version"
    appendTo="body"
  />

  <p-selectbutton
    [options]="orientations"
    optionLabel="label"
    optionValue="value"
    [ngModel]="template().orientation"
    (onChange)="setOrientation($event)"
    [allowEmpty]="false"
    [disabled]="isSaving() || !canEdit()"
    size="small"
    ariaLabelledBy="orientation-label"
  >
    <ng-template #item let-option>
      <i [class]="option.icon" aria-hidden="true"></i>
      <span>{{ option.label }}</span>
    </ng-template>
  </p-selectbutton>
  <span id="orientation-label" class="visually-hidden">Orientation</span>

  <p-button
    icon="pi pi-plus"
    label="Section"
    size="small"
    [outlined]="true"
    [disabled]="isSaving() || !canEdit()"
    (onClick)="addSection()"
  />

  <span class="status" aria-live="polite">
    @if (isSaving()) {
      <i class="pi pi-spin pi-spinner" aria-hidden="true"></i> Saving
    }
  </span>
</div>
