@if (entry(); as entry) {
  <div class="app-fields">
    <div class="app-field">
      <label for="column-block-name">Column block name</label>
      <input
        #nameInput
        pInputText
        pSize="small"
        id="column-block-name"
        type="text"
        maxlength="100"
        [value]="entry.block.name"
        [disabled]="!canEdit()"
        (change)="rename(nameInput)"
      />
    </div>

    <div class="app-field">
      <span class="app-field-label">Order, left to right</span>
      <app-move-buttons
        noun="column block"
        [position]="entry.number"
        [count]="blockCount()"
        [disabled]="isSaving() || !canEdit()"
        (moved)="move($event)"
      />
    </div>

    <div class="app-field">
      <app-sticky-columns-field
        id="column-block-sticky"
        label="Sticky columns"
        [count]="entry.block.stickyColumnCount"
        [available]="blockColumns()"
        [disabled]="isSaving() || !canEdit()"
        (changed)="setSticky($event)"
      />
    </div>

    <h3 class="app-group-title">Added on the sheet</h3>
    <div class="app-field-row">
      <div class="app-field">
        <label for="column-block-min">Fewest</label>
        <app-number-field
          inputId="column-block-min"
          [value]="entry.block.minInstances"
          [min]="0"
          [max]="1000"
          [disabled]="isSaving() || !canEdit()"
          (committed)="setCount('minInstances', $event)"
        />
      </div>
      <div class="app-field">
        <label for="column-block-initial">Starts with</label>
        <app-number-field
          inputId="column-block-initial"
          [value]="entry.block.initialInstances"
          [min]="0"
          [max]="1000"
          [disabled]="isSaving() || !canEdit()"
          (committed)="setCount('initialInstances', $event)"
        />
      </div>
      <div class="app-field">
        <label for="column-block-max">Most</label>
        <app-number-field
          inputId="column-block-max"
          [value]="entry.block.maxInstances"
          [min]="1"
          [max]="1000"
          [allowEmpty]="true"
          placeholder="No limit"
          [disabled]="isSaving() || !canEdit()"
          (committed)="setCount('maxInstances', $event)"
        />
      </div>
    </div>

    <h3 class="app-group-title">Cells</h3>
    <p class="app-field-note">{{ cellSummary() }}</p>
    <p class="app-field-note">
      Each row has its own cells for this block, and every copy on a sheet runs through every row.
      Add or change them from a row, or right-click a cell in the block.
    </p>

    <div class="app-danger-zone">
      <app-confirm-delete-button
        label="Delete column block"
        warning="Its cells in every row go too."
        [disabled]="isSaving() || !canEdit()"
        (confirmed)="delete()"
      />
    </div>
  </div>
}
