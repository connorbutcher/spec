@if (cellType(); as cellType) {
  <div class="fields">
    <div class="field">
      <label for="cell-type-name">Name</label>
      <input
        #nameInput
        pInputText
        pSize="small"
        id="cell-type-name"
        type="text"
        maxlength="100"
        [value]="cellType.name"
        (change)="rename(nameInput)"
      />
    </div>

    <div class="field">
      <label for="cell-type-kind">Kind</label>
      <p-select
        inputId="cell-type-kind"
        [options]="kinds"
        optionLabel="label"
        optionValue="kind"
        [ngModel]="cellType.kind"
        (onChange)="setKind($event)"
        [disabled]="isSaving()"
        size="small"
        [fluid]="true"
        appendTo="body"
      >
        <ng-template #item let-kind>
          <span class="kind-option">
            <i class="pi" [class]="kind.icon" aria-hidden="true"></i>
            {{ kind.label }}
          </span>
        </ng-template>
      </p-select>
      <span class="hint">{{ kind().description }}</span>
    </div>

    <div class="field">
      <label for="cell-type-description">Description</label>
      <textarea
        #descriptionInput
        pTextarea
        pSize="small"
        id="cell-type-description"
        rows="2"
        maxlength="500"
        placeholder="Optional notes for whoever fills this in"
        [value]="cellType.description ?? ''"
        (change)="setText('description', descriptionInput)"
      ></textarea>
    </div>

    @switch (cellType.kind) {
      @case ('Text') {
        <h3 class="group-title">Text settings</h3>
        <div class="field">
          <label for="cell-type-max-length">Max length</label>
          <app-number-field
            inputId="cell-type-max-length"
            [value]="cellType.maxLength"
            [min]="1"
            [max]="4000"
            [allowEmpty]="true"
            placeholder="No limit"
            [disabled]="isSaving()"
            (committed)="setNumber('maxLength', $event)"
          />
        </div>
      }
      @case ('Number') {
        <h3 class="group-title">Number settings</h3>
        <div class="inline">
          <div class="field">
            <label for="cell-type-min">Min</label>
            <app-number-field
              inputId="cell-type-min"
              [value]="cellType.minValue"
              [decimals]="4"
              [allowEmpty]="true"
              placeholder="None"
              [disabled]="isSaving()"
              (committed)="setNumber('minValue', $event)"
            />
          </div>
          <div class="field">
            <label for="cell-type-max">Max</label>
            <app-number-field
              inputId="cell-type-max"
              [value]="cellType.maxValue"
              [decimals]="4"
              [allowEmpty]="true"
              placeholder="None"
              [disabled]="isSaving()"
              (committed)="setNumber('maxValue', $event)"
            />
          </div>
          <div class="field">
            <label for="cell-type-decimals">Decimals</label>
            <app-number-field
              inputId="cell-type-decimals"
              [value]="cellType.decimalPlaces"
              [min]="0"
              [max]="6"
              [allowEmpty]="true"
              placeholder="Any"
              [disabled]="isSaving()"
              (committed)="setNumber('decimalPlaces', $event)"
            />
          </div>
        </div>
        <div class="field">
          <label for="cell-type-unit">Unit</label>
          <input
            #unitInput
            pInputText
            pSize="small"
            id="cell-type-unit"
            type="text"
            maxlength="20"
            placeholder="e.g. Nm, mm, °C"
            [value]="cellType.unit ?? ''"
            (change)="setText('unit', unitInput)"
          />
        </div>
      }
      @case ('Dropdown') {
        <h3 class="group-title">Options</h3>
        <app-cell-type-options-editor
          [options]="cellType.options"
          [disabled]="isSaving()"
          (changed)="setOptions($event)"
        />
      }
      @default {
        <p class="note">{{ kind().label }} cells have no extra settings.</p>
      }
    }

    <div class="danger-zone">
      <p class="note">{{ usage() }}</p>
      <app-confirm-delete-button
        label="Delete cell type"
        [disabled]="isSaving() || cellType.usageCount > 0"
        (confirmed)="delete()"
      />
    </div>
  </div>
}
