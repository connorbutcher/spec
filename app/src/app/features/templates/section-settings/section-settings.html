@if (entry(); as entry) {
  <div class="app-fields">
    <div class="app-field">
      <label for="section-name">{{ noun() }} name</label>
      <input
        #nameInput
        pInputText
        pSize="small"
        id="section-name"
        type="text"
        maxlength="100"
        [value]="entry.section.name"
        [disabled]="!canEdit()"
        (change)="rename(nameInput)"
      />
    </div>

    @if (isHeader()) {
      <p class="app-field-note">Always one, and always first.</p>
    } @else {
      @if (!isTopLevel()) {
        <div class="app-field">
          <span class="app-field-label">Order in its section</span>
          <app-move-buttons
            noun="sub-section"
            [position]="position()"
            [count]="entry.siblings.length"
            [disabled]="isSaving() || !canEdit()"
            (moved)="move($event)"
          />
        </div>
      }

      <app-instance-counts-fields
        idPrefix="section"
        [counts]="entry.section"
        [disabled]="isSaving() || !canEdit()"
        (changed)="setCounts($event)"
      />
    }

    <h3 class="app-group-title">Rows</h3>
    <app-panel-link-list [items]="rows()" emptyText="No rows yet." ariaLabel="Rows" />
    <div class="app-actions">
      <p-button
        icon="pi pi-plus"
        label="Add row"
        size="small"
        [outlined]="true"
        [disabled]="isSaving() || !canEdit()"
        (onClick)="addRow()"
      />
    </div>

    @if (!isHeader()) {
      <h3 class="app-group-title">Sub-sections</h3>
      <app-panel-link-list
        [items]="childSections()"
        emptyText="No sub-sections yet."
        ariaLabel="Sub-sections"
      />
      <div class="app-actions">
        <p-button
          icon="pi pi-plus"
          label="Add sub-section"
          size="small"
          [outlined]="true"
          [disabled]="isSaving() || !canEdit()"
          (onClick)="addSubSection()"
        />
      </div>

      <div class="app-danger-zone">
        <app-confirm-delete-button
          [label]="'Delete ' + noun().toLowerCase()"
          [warning]="deleteWarning()"
          [disabled]="isSaving() || !canEdit()"
          (confirmed)="delete()"
        />
      </div>
    }
  </div>
}
