@if (entry(); as entry) {
  <div class="fields">
    <div class="field">
      <label for="section-name">{{ noun() }} name</label>
      <input
        #nameInput
        pInputText
        pSize="small"
        id="section-name"
        type="text"
        maxlength="100"
        [value]="entry.section.name"
        [disabled]="!canEdit()"
        (change)="rename(nameInput)"
      />
    </div>

    @if (isHeader()) {
      <p class="note">Always one, and always first.</p>
    } @else {
      @if (!isTopLevel()) {
        <div class="field">
          <span class="label">Order in its section</span>
          <app-move-buttons
            noun="sub-section"
            [position]="position()"
            [count]="entry.siblings.length"
            [disabled]="isSaving() || !canEdit()"
            (moved)="move($event)"
          />
        </div>
      }

      <h3 class="group-title">Added on the sheet</h3>
      <div class="inline">
        <div class="field">
          <label for="section-min">Fewest</label>
          <app-number-field
            inputId="section-min"
            [value]="entry.section.minInstances"
            [min]="0"
            [max]="1000"
            [disabled]="isSaving() || !canEdit()"
            (committed)="setCount('minInstances', $event)"
          />
        </div>
        <div class="field">
          <label for="section-initial">Starts with</label>
          <app-number-field
            inputId="section-initial"
            [value]="entry.section.initialInstances"
            [min]="0"
            [max]="1000"
            [disabled]="isSaving() || !canEdit()"
            (committed)="setCount('initialInstances', $event)"
          />
        </div>
        <div class="field">
          <label for="section-max">Most</label>
          <app-number-field
            inputId="section-max"
            [value]="entry.section.maxInstances"
            [min]="1"
            [max]="1000"
            [allowEmpty]="true"
            placeholder="No limit"
            [disabled]="isSaving() || !canEdit()"
            (committed)="setCount('maxInstances', $event)"
          />
        </div>
      </div>
    }

    <h3 class="group-title">Rows</h3>
    <app-panel-link-list [items]="rows()" emptyText="No rows yet." ariaLabel="Rows" />
    <div class="actions">
      <p-button
        icon="pi pi-plus"
        label="Add row"
        size="small"
        [outlined]="true"
        [disabled]="isSaving() || !canEdit()"
        (onClick)="addRow()"
      />
    </div>

    @if (!isHeader()) {
      <h3 class="group-title">Sub-sections</h3>
      <app-panel-link-list
        [items]="childSections()"
        emptyText="No sub-sections yet."
        ariaLabel="Sub-sections"
      />
      <div class="actions">
        <p-button
          icon="pi pi-plus"
          label="Add sub-section"
          size="small"
          [outlined]="true"
          [disabled]="isSaving() || !canEdit()"
          (onClick)="addSubSection()"
        />
      </div>

      <div class="danger-zone">
        <app-confirm-delete-button
          [label]="'Delete ' + noun().toLowerCase()"
          [warning]="deleteWarning()"
          [disabled]="isSaving() || !canEdit()"
          (confirmed)="delete()"
        />
      </div>
    }
  </div>
}
