@if (entry(); as entry) {
  <app-settings-group title="General" key="section-general">
    <div class="app-field">
      <label for="section-name">{{ noun() }} name</label>
      <input
        #nameInput
        pInputText
        pSize="small"
        id="section-name"
        type="text"
        maxlength="100"
        [value]="entry.section.name"
        [disabled]="!canEdit()"
        (change)="rename(nameInput)"
      />
    </div>
    @if (isHeader()) {
      <p class="app-field-note">Always one, and always first.</p>
    }
  </app-settings-group>

  @if (!isHeader()) {
    <app-settings-group title="Added on the sheet" key="section-instances">
      <app-instance-counts-fields
        idPrefix="section"
        [counts]="entry.section"
        [disabled]="isSaving() || !canEdit()"
        (changed)="setCounts($event)"
      />
    </app-settings-group>
  }
}
