@for (child of layout().children; track child.section.id) {
  <app-canvas-section [layout]="child" />
}

@for (cell of layout().cells; track cell.cell.id) {
  <app-canvas-cell [layout]="cell" />
}

@if (layout().emptyStyle; as emptyStyle) {
  <button
    type="button"
    class="empty"
    [style]="emptyStyle"
    [attr.aria-label]="layout().section.name + ' is empty. Open its settings.'"
    (click)="open()"
    (contextmenu)="openMenu($event)"
  >
    {{ layout().section.name }}: empty. Right-click to add a row or section.
  </button>
}
