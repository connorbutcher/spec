<ol class="options">
  @for (option of options(); track option.id; let index = $index, first = $first, last = $last) {
    <li>
      <input
        #optionInput
        type="text"
        maxlength="100"
        [attr.aria-label]="'Option ' + (index + 1)"
        [value]="option.value"
        [disabled]="disabled()"
        (change)="rename(index, optionInput)"
      />
      <button
        type="button"
        [disabled]="disabled() || first"
        aria-label="Move option up"
        (click)="move(index, -1)"
      >
        <i class="pi pi-chevron-up" aria-hidden="true"></i>
      </button>
      <button
        type="button"
        [disabled]="disabled() || last"
        aria-label="Move option down"
        (click)="move(index, 1)"
      >
        <i class="pi pi-chevron-down" aria-hidden="true"></i>
      </button>
      <button
        type="button"
        class="remove"
        [disabled]="disabled()"
        aria-label="Remove option"
        (click)="remove(index)"
      >
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </li>
  } @empty {
    <li class="none">No options yet. A dropdown needs at least one.</li>
  }
</ol>

<div class="add">
  <input
    #newOption
    type="text"
    maxlength="100"
    placeholder="New option"
    aria-label="New option"
    [disabled]="disabled()"
    (keydown.enter)="add(newOption)"
  />
  <button type="button" [disabled]="disabled()" (click)="add(newOption)">
    <i class="pi pi-plus" aria-hidden="true"></i> Add
  </button>
</div>
