@if (entry(); as entry) {
  <app-settings-group title="General" key="cell-general">
    <app-cell-type-field
      [cellTypeId]="entry.cell.cellTypeId"
      [disabled]="isSaving() || !canEdit()"
      (changed)="setType($event)"
    />

    <div class="app-field">
      <label for="cell-caption">{{ isDisplayOnly() ? 'Text' : 'Caption' }}</label>
      <input
        #captionInput
        pInputText
        pSize="small"
        id="cell-caption"
        type="text"
        maxlength="200"
        [placeholder]="isDisplayOnly() ? 'e.g. Torque' : 'Optional prompt'"
        [value]="entry.cell.caption ?? ''"
        [disabled]="!canEdit()"
        (change)="setCaption(captionInput)"
      />
    </div>

    @if (!isDisplayOnly()) {
      <div class="app-check">
        <p-checkbox
          inputId="cell-required"
          [binary]="true"
          [ngModel]="entry.cell.isRequired"
          (onChange)="setRequired($event)"
          [disabled]="isSaving() || !canEdit()"
          size="small"
        />
        <label for="cell-required">Must be filled in</label>
      </div>
    }

    @if (kind().kind === 'Text') {
      <div class="app-field">
        <label for="cell-lookup-key">Lookup key</label>
        <input
          #lookupKeyInput
          pInputText
          pSize="small"
          id="cell-lookup-key"
          type="text"
          maxlength="50"
          placeholder="e.g. partNumber"
          [value]="entry.cell.lookupKey ?? ''"
          (change)="setLookupKey(lookupKeyInput)"
        />
        <span class="hint">
          Other systems find this cell by its value under this name. It can be set on a version
          sheets already use.
        </span>
      </div>
    }
  </app-settings-group>

  <app-settings-group title="Placement" key="cell-placement" [note]="blockName()">
    <app-cell-placement-fields
      [placement]="entry.cell"
      [disabled]="isSaving() || !canEdit()"
      (changed)="setPlacement($event)"
    />
  </app-settings-group>

  @if (cellType(); as cellType) {
    <app-cell-overrides
      [cell]="entry.cell"
      [cellType]="cellType"
      [disabled]="!canEdit()"
      [busy]="isSaving()"
      (changed)="setOverrides($event)"
    />
  }
}
