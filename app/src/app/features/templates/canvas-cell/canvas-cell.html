<p-button
  styleClass="cell"
  [text]="true"
  severity="secondary"
  [style]="contentStyle()"
  [ariaLabel]="(layout().cell.caption || typeName()) + ' cell'"
  (onClick)="open()"
  (contextmenu)="openMenu($event)"
>
  <span class="caption">
    {{ layout().cell.caption }}
    @if (layout().cell.isRequired && !isLabel()) {
      <span class="required" aria-label="required">*</span>
    }
  </span>
  @if (!isLabel()) {
    <span class="type">{{ typeName() }}</span>
  }
</p-button>
