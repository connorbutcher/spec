<div class="app-field-row">
  <div class="app-field">
    <label [for]="idPrefix() + '-min'">Fewest</label>
    <app-number-field
      [inputId]="idPrefix() + '-min'"
      [value]="counts().minInstances"
      [min]="0"
      [max]="1000"
      [disabled]="disabled()"
      (committed)="setCount('minInstances', $event)"
    />
  </div>
  <div class="app-field">
    <label [for]="idPrefix() + '-initial'">Starts with</label>
    <app-number-field
      [inputId]="idPrefix() + '-initial'"
      [value]="counts().initialInstances"
      [min]="0"
      [max]="1000"
      [disabled]="disabled()"
      (committed)="setCount('initialInstances', $event)"
    />
  </div>
  <div class="app-field">
    <label [for]="idPrefix() + '-max'">Most</label>
    <app-number-field
      [inputId]="idPrefix() + '-max'"
      [value]="counts().maxInstances"
      [min]="1"
      [max]="1000"
      [allowEmpty]="true"
      placeholder="No limit"
      [disabled]="disabled()"
      (committed)="setCount('maxInstances', $event)"
    />
  </div>
</div>
