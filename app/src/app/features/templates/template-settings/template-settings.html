@if (template(); as template) {
  <div class="fields">
    <div class="field">
      <label for="template-name">Name</label>
      <input
        #nameInput
        pInputText
        pSize="small"
        id="template-name"
        type="text"
        maxlength="100"
        [value]="template.name"
        (change)="rename(nameInput)"
      />
    </div>

    <div class="field">
      <span class="label" id="template-orientation-label">Orientation</span>
      <p-selectbutton
        [options]="orientations"
        optionLabel="label"
        optionValue="value"
        [ngModel]="template.orientation"
        (onChange)="setOrientation($event)"
        [allowEmpty]="false"
        [disabled]="isSaving() || !canEdit()"
        size="small"
        ariaLabelledBy="template-orientation-label"
      />
    </div>

    <h3 class="group-title">Header and sections</h3>
    <app-panel-link-list
      [items]="sections()"
      emptyText="No sections yet."
      ariaLabel="Header and sections"
    />
    <div class="actions">
      <p-button
        icon="pi pi-plus"
        label="Add section"
        size="small"
        [outlined]="true"
        [disabled]="isSaving() || !canEdit()"
        (onClick)="addSection()"
      />
    </div>

    <div class="danger-zone">
      <app-confirm-delete-button
        label="Delete table"
        warning="Every version, with its sections, rows and cells, goes too."
        [disabled]="isSaving()"
        (confirmed)="delete()"
      />
    </div>
  </div>
}
