@if (template(); as template) {
  <app-settings-group title="General" key="table-general">
    <div class="app-field">
      <label for="template-name">Name</label>
      <input
        #nameInput
        pInputText
        pSize="small"
        id="template-name"
        type="text"
        maxlength="100"
        [value]="template.name"
        (change)="rename(nameInput)"
      />
    </div>

    @if (isHorizontal()) {
      <div class="app-field">
        <app-sticky-columns-field
          id="template-sticky"
          label="Sticky columns"
          [count]="template.stickyColumnCount"
          [available]="ownColumns()"
          [disabled]="isSaving() || !canEdit()"
          (changed)="setSticky($event)"
        />
      </div>
      <p class="app-field-note">
        People add copies of each column block across the sheet. Every row has cells in every copy.
      </p>
    }
  </app-settings-group>

  <app-settings-group title="Delete" key="table-delete">
    <app-confirm-delete-button
      label="Delete table"
      warning="Every version, with its sections, rows and cells, goes too."
      [disabled]="isSaving()"
      (confirmed)="delete()"
    />
  </app-settings-group>
}
