<div class="app-card designer">
  @if (hasError()) {
    <app-empty-state
      icon="pi-exclamation-circle"
      title="Couldn't load this table"
      message="It may have been deleted, or the API isn't running."
    >
      <p-button label="Try again" size="small" [outlined]="true" (onClick)="retry()" />
    </app-empty-state>
  } @else if (isLoading()) {
    <p class="app-note loading">Loading table…</p>
  } @else {
    @if (template(); as template) {
      <app-designer-toolbar [template]="template" />

      <div class="workspace">
        <nav class="outline" aria-label="Table structure">
          <app-structure-outline />
        </nav>

        <div class="canvas-scroll">
          @if (layout(); as layout) {
            <app-template-canvas [layout]="layout" />
          }
        </div>
      </div>
    }
  }
</div>
