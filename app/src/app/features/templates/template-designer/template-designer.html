<div class="app-card designer">
  @if (hasError()) {
    <app-empty-state
      icon="pi-exclamation-circle"
      title="Couldn't load this table"
      message="It may have been deleted, or the API isn't running."
    >
      <p-button label="Try again" size="small" [outlined]="true" (onClick)="retry()" />
    </app-empty-state>
  } @else if (isLoading()) {
    <p class="loading">Loading table…</p>
  } @else {
    @if (template(); as template) {
      <app-designer-toolbar [template]="template" />
      <app-version-banner [template]="template" />

      <div class="canvas-scroll">
        @if (layout(); as layout) {
          <app-template-canvas [layout]="layout" />
        } @else {
          <app-empty-state
            icon="pi-objects-column"
            title="This table has no sections yet"
            message="Sections group the table's cells. Add one, then give it rows and cells, or sections inside it."
          >
            <p-button
              icon="pi pi-plus"
              label="Add section"
              size="small"
              [outlined]="true"
              [disabled]="!canEdit()"
              (onClick)="addFirstSection()"
            />
          </app-empty-state>
        }
      </div>
    }
  }
</div>
