@if (entry(); as entry) {
  <div class="app-fields">
    <p class="app-field-note">Row {{ entry.number }} of {{ entry.section.name }}</p>

    <div class="app-field">
      <span class="app-field-label">Position</span>
      <app-move-buttons
        noun="row"
        [position]="entry.number"
        [count]="entry.section.rows.length"
        [disabled]="isSaving() || !canEdit()"
        (moved)="move($event)"
      />
    </div>

    <h3 class="app-group-title">Cells</h3>
    <app-panel-link-list
      [items]="cells()"
      emptyText="No cells in this row yet."
      ariaLabel="Cells"
    />
    <div class="app-actions">
      <p-button
        icon="pi pi-plus"
        label="Add cell"
        size="small"
        [outlined]="true"
        [disabled]="isSaving() || !canEdit()"
        (onClick)="addCell()"
      />
      @for (block of columnBlocks(); track block.id) {
        <p-button
          icon="pi pi-plus"
          [label]="'Add cell to ' + block.name"
          size="small"
          [outlined]="true"
          [disabled]="isSaving() || !canEdit()"
          (onClick)="addCell(block.id)"
        />
      }
    </div>
    <p class="app-field-note">
      New cells go after the last cell in the row, or in the column block.
    </p>

    <div class="app-danger-zone">
      <app-confirm-delete-button
        label="Delete row"
        warning="Its cells go too."
        [disabled]="isSaving() || !canEdit()"
        (confirmed)="delete()"
      />
    </div>
  </div>
}
