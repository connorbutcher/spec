@if (entry(); as entry) {
  <div class="fields">
    <p class="note">Row {{ entry.number }} of {{ entry.section.name }}</p>

    <div class="field">
      <span class="label">Position</span>
      <app-move-buttons
        noun="row"
        [position]="entry.number"
        [count]="entry.section.rows.length"
        [disabled]="isSaving() || !canEdit()"
        (moved)="move($event)"
      />
    </div>

    <h3 class="group-title">Cells</h3>
    <app-panel-link-list
      [items]="cells()"
      emptyText="No cells in this row yet."
      ariaLabel="Cells"
    />
    <div class="actions">
      <p-button
        icon="pi pi-plus"
        label="Add cell"
        size="small"
        [outlined]="true"
        [disabled]="isSaving() || !canEdit()"
        (onClick)="addCell()"
      />
    </div>
    <p class="note">New cells go after the last cell in the row.</p>

    <div class="danger-zone">
      <app-confirm-delete-button
        label="Delete row"
        warning="Its cells go too."
        [disabled]="isSaving() || !canEdit()"
        (confirmed)="delete()"
      />
    </div>
  </div>
}
