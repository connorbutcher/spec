<p-dialog
  [header]="header()"
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '24rem' }"
  (onShow)="reset()"
>
  <div class="app-fields">
    @for (identifier of identifiers(); track identifier.id) {
      <app-identifier-value-field
        [identifier]="identifier"
        [value]="valueOf(identifier.id)"
        (valueChange)="setValue(identifier.id, $event)"
      />
    }

    @if (copySources().length > 0) {
      <div class="app-field">
        <label for="new-sheet-copy-from">
          Start as a copy of
          <span class="optional">optional</span>
        </label>
        <p-select
          size="small"
          inputId="new-sheet-copy-from"
          [fluid]="true"
          appendTo="body"
          [options]="copySources()"
          optionLabel="label"
          optionValue="id"
          [showClear]="true"
          placeholder="An empty sheet"
          [ngModel]="copyFromSheetId()"
          (ngModelChange)="copyFromSheetId.set($event)"
        />
        <p class="app-field-note">
          Copies its latest published tables and values as your drafts, to change and submit as usual.
        </p>
      </div>
    }

    <p class="app-field-note">The identifiers can't be changed once the sheet is created.</p>

    @if (error(); as error) {
      <app-error-message [message]="error" />
    }
  </div>

  <ng-template #footer>
    <app-dialog-actions
      confirmLabel="Create sheet"
      confirmIcon="pi pi-plus"
      [confirmDisabled]="!canCreate()"
      [busy]="isSaving()"
      (cancelled)="visible.set(false)"
      (confirmed)="create()"
    />
  </ng-template>
</p-dialog>
