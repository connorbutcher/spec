@if (phase(); as phase) {
  <article class="phase-detail">
    <app-phase-breadcrumb [ancestors]="ancestors()" [current]="phase" />
    <app-phase-detail-header [phase]="phase" [parent]="ancestors().at(-1)" />

    <section class="app-card block" aria-labelledby="sheet-types-heading">
      <header class="block-head">
        <h2 id="sheet-types-heading">PU Spec Sheet types</h2>
        <span class="block-count">{{ sheetTypes().length }}</span>
      </header>
      <app-sheet-type-grid [sheetTypes]="sheetTypes()" />
    </section>

    @if (children().length > 0) {
      <section class="app-card block" aria-labelledby="child-phases-heading">
        <header class="block-head">
          <h2 id="child-phases-heading">Phases under {{ phase.code }}</h2>
          <span class="block-count">{{ children().length }}</span>
        </header>
        <app-child-phase-list [phases]="children()" />
      </section>
    }
  </article>
} @else if (!isLoading()) {
  <div class="app-card">
    <app-empty-state
      icon="pi-search"
      title="Phase not found"
      message="It may have been removed. Pick another phase from the tree."
    />
  </div>
}
