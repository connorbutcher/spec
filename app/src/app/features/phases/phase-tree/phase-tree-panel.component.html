<aside class="app-card tree-panel" aria-labelledby="phase-tree-heading">
  <header class="panel-head">
    <h2 id="phase-tree-heading">Phases</h2>
  </header>

  @if (hasError()) {
    <app-empty-state
      icon="pi-exclamation-circle"
      title="Couldn't load phases"
      message="Check the API is running, then try again."
    >
      <button type="button" class="retry" (click)="retry()">Try again</button>
    </app-empty-state>
  } @else if (isLoading() && !hasPhases()) {
    <app-phase-tree-skeleton />
  } @else if (!hasPhases()) {
    <app-empty-state
      icon="pi-sitemap"
      title="No phases yet"
      message="Phases will be added in the admin section."
    />
  } @else {
    <app-phase-tree-filter [(query)]="filterQuery" />
    @if (nodes().length > 0) {
      <app-phase-tree [nodes]="nodes()" [forceExpanded]="isFiltering()" />
    } @else {
      <p class="no-matches">No phases match "{{ filterQuery() }}".</p>
    }
  }
</aside>
