<li
  class="tree-item"
  role="treeitem"
  [attr.aria-expanded]="hasChildren() ? expanded() : null"
  [attr.aria-level]="depth() + 1"
>
  <div class="row" [style.padding-left]="indent()">
    @if (hasChildren()) {
      <button
        type="button"
        class="toggle"
        [attr.aria-label]="(expanded() ? 'Collapse ' : 'Expand ') + node().phase.code"
        (click)="toggle()"
      >
        <i
          class="pi"
          [class]="expanded() ? 'pi-chevron-down' : 'pi-chevron-right'"
          aria-hidden="true"
        ></i>
      </button>
    } @else {
      <span class="toggle-spacer" aria-hidden="true"></span>
    }

    <a
      class="phase-link"
      [routerLink]="['/phases', node().phase.id]"
      routerLinkActive="selected"
      ariaCurrentWhenActive="page"
    >
      <span class="code">{{ node().phase.code }}</span>
      <span class="count" [attr.aria-label]="sheetTypeCount() + ' sheet types'">{{
        sheetTypeCount()
      }}</span>
    </a>
  </div>

  @if (hasChildren() && expanded()) {
    <ul class="children" role="group">
      @for (child of node().children; track child.phase.id) {
        <app-phase-tree-node
          [node]="child"
          [depth]="depth() + 1"
          [forceExpanded]="forceExpanded()"
        />
      }
    </ul>
  }
</li>
