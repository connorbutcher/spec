<p-dialog
  header="Add sheet type"
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '22rem' }"
  (onShow)="reset()"
>
  <div class="app-fields">
    <div class="app-field">
      <label for="add-sheet-type-name">Name</label>
      <input
        pInputText
        pSize="small"
        id="add-sheet-type-name"
        type="text"
        maxlength="100"
        autocomplete="off"
        placeholder="e.g. Torque Sheet"
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
        (keydown.enter)="add()"
      />
      <p class="app-field-note">No phase has it until you tick it for a phase on the Phases tab.</p>
    </div>

    @if (error(); as error) {
      <app-error-message [message]="error" />
    }
  </div>

  <ng-template #footer>
    <app-dialog-actions
      confirmLabel="Add sheet type"
      confirmIcon="pi pi-plus"
      [confirmDisabled]="!canAdd()"
      [busy]="isSaving()"
      (cancelled)="visible.set(false)"
      (confirmed)="add()"
    />
  </ng-template>
</p-dialog>
