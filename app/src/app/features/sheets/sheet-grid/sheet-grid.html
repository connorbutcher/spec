<div class="grid" role="grid" [attr.aria-label]="label()" [style]="layout().style">
  @for (section of layout().sections; track section.section.id) {
    <app-sheet-grid-section [layout]="section" />
  }
  @for (block of layout().columnBlocks; track block.block.id) {
    <app-sheet-grid-column-block [layout]="block" [table]="table()" />
  }
</div>
