<div class="sheet-toolbar" role="toolbar" aria-label="Sheet tools">
  <app-sheet-version-picker />
  <app-sheet-compare-picker />

  @if (readOnlyLabel(); as label) {
    <p-tag [value]="label" icon="pi pi-lock" severity="secondary" [rounded]="true" />
  }

  <span class="spacer"></span>

  <app-sheet-presence />

  <p-button
    icon="pi pi-refresh"
    size="small"
    severity="secondary"
    [text]="true"
    ariaLabel="Refresh the sheet"
    (onClick)="reload()"
  />

  @if (canEdit()) {
    <p-button
      label="Add table"
      icon="pi pi-plus"
      size="small"
      severity="secondary"
      [outlined]="true"
      [disabled]="!hasTemplates() || isBusy()"
      (onClick)="tableMenu.toggle($event)"
    />
    <p-menu #tableMenu [popup]="true" [model]="templateMenu()" appendTo="body" />

    <app-sheet-publish />
  }
</div>
