<div class="spec-sheet-version-option">
  @if (specSheet().properties.length > 0) {
    <app-sheet-summary-properties-display
      [specSheet]="specSheet()"
      [specSheetType]="specSheetType()"
    />
  } @else {
    <span>Version {{ specSheet().versionNumber }}</span>
  }

  @if (specSheet().isDraft) {
    <span class="sheet-state">Draft</span>
  } @else {
    <span class="sheet-state locked">Locked</span>
  }

  @if (showAvatars()) {
    <app-pu-spec-sheet-avatar
      [puSpecSheetId]="specSheet().sheetId"
      size="xsmall"
    />
  }
</div>
