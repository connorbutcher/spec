@if (waiting(); as takeover) {
  <span class="note" aria-live="polite">
    Asked {{ takeover.holderName }} · yours in {{ secondsLeft() }}s if unanswered
  </span>
  <p-button
    label="Withdraw"
    size="small"
    severity="secondary"
    [text]="true"
    (onClick)="withdraw(takeover)"
  />
} @else if (blockedReason(); as reason) {
  <span class="note" role="note">
    <i class="pi pi-ban" aria-hidden="true"></i>
    {{ reason }}
  </span>
} @else {
  <p-button
    label="Request takeover"
    icon="pi pi-user-edit"
    size="small"
    severity="secondary"
    [outlined]="true"
    [disabled]="!canRequest()"
    pTooltip="Ask for this row. Only a row they haven't changed yet can be handed over."
    tooltipPosition="bottom"
    (onClick)="request()"
  />
}
