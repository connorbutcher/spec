@if (cellDetail(); as detail) {
  <span
    class="cell-mark"
    role="img"
    [pTooltip]="detail"
    tooltipPosition="left"
    [attr.aria-label]="'Changed in ' + detail"
  ></span>
}

@if (warning(); as message) {
  <i
    class="pi pi-exclamation-triangle warning"
    role="img"
    [pTooltip]="message"
    tooltipPosition="left"
    [attr.aria-label]="message"
  ></i>
}
