<textarea
  pTextarea
  pSize="small"
  rows="1"
  [autoResize]="true"
  [attr.maxlength]="settings()?.maxLength ?? null"
  [attr.aria-label]="label() || 'Text'"
  [placeholder]="label()"
  [ngModel]="text()"
  (ngModelChange)="text.set($event)"
  (focus)="started.emit()"
  (blur)="commit()"
  (keydown.enter)="enter($event)"
  (keydown.escape)="revert()"
></textarea>
