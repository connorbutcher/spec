<form class="app-fields source-form" (submit)="$event.preventDefault()">
  <div class="app-field">
    <label for="linked-source-table">Take the choices from table</label>
    <p-select
      size="small"
      inputId="linked-source-table"
      appendTo="body"
      optionLabel="label"
      optionValue="id"
      placeholder="Choose a table"
      emptyMessage="No table on this sheet has anything to link to"
      [fluid]="true"
      [options]="tables()"
      [ngModel]="tableId()"
      (ngModelChange)="tableId.set($event)"
      [ngModelOptions]="{ standalone: true }"
    />
  </div>
  <div class="app-field">
    <span class="app-field-label" id="linked-source-part">The choices are the values in</span>
    <p-selectbutton
      size="small"
      optionLabel="label"
      optionValue="value"
      ariaLabelledBy="linked-source-part"
      [allowEmpty]="false"
      [options]="parts"
      [ngModel]="part()"
      (ngModelChange)="part.set($event)"
      [ngModelOptions]="{ standalone: true }"
    />
  </div>
  @if (part() === 'column') {
    <div class="app-field">
      <label for="linked-source-column">Column</label>
      <p-select
        size="small"
        inputId="linked-source-column"
        appendTo="body"
        optionLabel="label"
        optionValue="templateCellId"
        placeholder="Choose a column"
        [fluid]="true"
        [disabled]="tableId() === null"
        [options]="columns()"
        [ngModel]="templateCellId()"
        (ngModelChange)="templateCellId.set($event)"
        [ngModelOptions]="{ standalone: true }"
      />
    </div>
    <p class="app-field-note">The cell offers that column's value from every row of the table.</p>
  } @else {
    <div class="app-field">
      <label for="linked-source-row">Row</label>
      <p-select
        size="small"
        inputId="linked-source-row"
        appendTo="body"
        optionLabel="label"
        optionValue="sheetRowId"
        placeholder="Choose a row"
        emptyMessage="That table has no rows with values yet"
        [fluid]="true"
        [filter]="hasRowFilter()"
        [disabled]="tableId() === null"
        [options]="rows()"
        [ngModel]="rowId()"
        (ngModelChange)="rowId.set($event)"
        [ngModelOptions]="{ standalone: true }"
      />
    </div>
    <p class="app-field-note">
      A row is named by its first value. The cell offers every other value in that row.
    </p>
  }
  <p class="app-field-note">Pointing the cell somewhere else clears what was chosen.</p>
  <div class="buttons">
    <p-button
      label="Clear"
      size="small"
      severity="secondary"
      [text]="true"
      [disabled]="!hasSettings()"
      (onClick)="applied.emit(null)"
    />
    <span class="spacer"></span>
    <app-dialog-actions
      confirmLabel="Apply"
      [confirmDisabled]="!canApply()"
      (cancelled)="cancelled.emit()"
      (confirmed)="apply()"
    />
  </div>
</form>
