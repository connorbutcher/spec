<div class="version-picker" role="group" aria-label="Which version of the sheet to show">
  <p-select
    size="small"
    optionLabel="label"
    optionValue="value"
    ariaLabel="Version"
    [options]="options()"
    [ngModel]="selected()"
    [disabled]="!hasVersions() && selected() === null"
    placeholder="No versions yet"
    (onChange)="chooseVersion($event.value)"
  >
    <ng-template #item let-option>
      <span class="option">
        <span>{{ option.label }}</span>
        @if (option.note) {
          <span class="note app-truncate" [title]="option.note">{{ option.note }}</span>
        }
      </span>
    </ng-template>
  </p-select>
  <p-datepicker
    size="small"
    placeholder="As of date"
    dateFormat="yy-mm-dd"
    [showTime]="true"
    hourFormat="24"
    [showIcon]="true"
    [showClear]="true"
    [showButtonBar]="true"
    [maxDate]="today"
    ariaLabel="Show the sheet as of a date and time"
    [disabled]="!hasVersions()"
    [ngModel]="asOf()"
    (onSelect)="chooseDate($event)"
    (onClear)="chooseDate(null)"
  />
</div>
