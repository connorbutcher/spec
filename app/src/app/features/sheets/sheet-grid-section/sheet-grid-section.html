@for (row of rows(); track row.rowId) {
  <div class="row" role="row">
    @if (!isHeader()) {
      <app-sheet-row-status-cell
        appSheetAnchor="row"
        [anchorId]="row.rowId"
        [rowId]="row.rowId"
        [style]="row.statusStyle"
      />
    } @else if ($first) {
      <app-sheet-status-heading [style]="headingStyle" />
    }
    @for (cell of row.cells; track cell.cell.id) {
      <app-sheet-grid-cell
        appSheetAnchor="cell"
        [anchorId]="cell.cell.id"
        [layout]="cell"
        [cell]="sheetCells().get(cell.cell.id) ?? null"
        [row]="sheetRows().get(row.rowId) ?? null"
        [tone]="tone()"
      />
    }
  </div>
}

@for (child of layout().children; track child.section.id) {
  <app-sheet-grid-section appSheetAnchor="section" [anchorId]="child.section.id" [layout]="child" />
}

@if (layout().emptyStyle; as emptyStyle) {
  <div class="empty" [style]="emptyStyle">Empty section</div>
}

@if (change(); as change) {
  <div class="change">
    <app-sheet-change-tag [change]="change" />
  </div>
}
