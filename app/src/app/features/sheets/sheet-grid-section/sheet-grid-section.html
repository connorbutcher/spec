@for (cell of layout().cells; track cell.cell.id) {
  <app-sheet-grid-cell [layout]="cell" />
}

@for (child of layout().children; track child.section.id) {
  <app-sheet-grid-section [layout]="child" />
}

@if (layout().emptyStyle; as emptyStyle) {
  <div class="empty" [style]="emptyStyle">Empty section</div>
}

@if (canAdd() && sheetSection(); as section) {
  <div class="add" [style.left]="gutterOffset()" (click)="$event.stopPropagation()">
    <app-sheet-add-menu
      [tableId]="tableId()"
      [sectionId]="section.id"
      [sections]="section.addableSections"
    />
  </div>
}
