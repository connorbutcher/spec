@if (submission(); as submission) {
  <app-sheet-submission-line [submission]="submission" [showReview]="false" (decided)="backToLive()" />
} @else {
  <div class="pending">
    <i class="pi pi-clock app-status-tone" data-tone="approval" aria-hidden="true"></i>
    Changes waiting for approval
  </div>
}
@if (approvals.error(); as message) {
  <div class="error">
    <app-error-message [message]="message" [closable]="true" (dismissed)="approvals.error.set(null)" />
  </div>
}
