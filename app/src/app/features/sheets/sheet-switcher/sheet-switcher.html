<p-tabs class="sheet-switcher" [value]="currentId()" [scrollable]="true">
  <p-tablist>
    @for (tab of tabs(); track tab.id) {
      <p-tab [value]="tab.id" [routerLink]="tab.link">
        <i class="pi" [class]="tab.icon" aria-hidden="true"></i>
        {{ tab.name }}
      </p-tab>
    }
  </p-tablist>
</p-tabs>
