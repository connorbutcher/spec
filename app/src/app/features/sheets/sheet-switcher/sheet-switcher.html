<p-tabs class="sheet-switcher" [value]="currentId()" [scrollable]="true">
  <p-tablist>
    @for (sheetType of sheetTypes(); track sheetType.id) {
      <p-tab [value]="sheetType.id" [routerLink]="link(sheetType)">
        <i class="pi" [class]="icon(sheetType)" aria-hidden="true"></i>
        {{ sheetType.name }}
      </p-tab>
    }
  </p-tablist>
</p-tabs>
