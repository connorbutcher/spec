@if (hasChoices()) {
  <p-button
    [label]="iconOnly() ? undefined : label()"
    [ariaLabel]="label()"
    icon="pi pi-plus"
    size="small"
    severity="secondary"
    [outlined]="!iconOnly()"
    [text]="iconOnly()"
    [disabled]="isBusy() || (only()?.disabled ?? false)"
    (onClick)="add($event)"
  />
  @if (only() === null) {
    <p-menu [popup]="true" [model]="menuItems()" appendTo="body" />
  }
}
