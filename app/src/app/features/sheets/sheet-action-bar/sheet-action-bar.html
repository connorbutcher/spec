@if (section(); as section) {
  <div class="action-bar" role="toolbar" aria-label="Actions for the selection">
    <p-breadcrumb class="path" [model]="path()" />

    <div class="group" role="group" aria-label="Section">
      @if (!isHeader()) {
        <p-button
          icon="pi pi-arrow-up"
          size="small"
          severity="secondary"
          [text]="true"
          [disabled]="!canMoveSectionUp() || isBusy()"
          ariaLabel="Move the section up"
          (onClick)="moveSection(-1)"
        />
        <p-button
          icon="pi pi-arrow-down"
          size="small"
          severity="secondary"
          [text]="true"
          [disabled]="!canMoveSectionDown() || isBusy()"
          ariaLabel="Move the section down"
          (onClick)="moveSection(1)"
        />
        <p-button
          icon="pi pi-trash"
          size="small"
          severity="secondary"
          [text]="true"
          [disabled]="!section.canRemove || isBusy()"
          ariaLabel="Remove the section"
          (onClick)="askRemoveSection($event)"
        />
      }
    </div>

    @if (row(); as row) {
      <div class="group" role="group" aria-label="Row">
        @if (rowStatus(); as status) {
          <span class="row-label">Row</span>
          <app-sheet-status [status]="status" />
        }
        @if (lockedByOther() && canEdit()) {
          <app-sheet-takeover-button [row]="row" />
        }
        @if (row.canRemove && hasSeveralRows()) {
          <p-button
            icon="pi pi-arrow-up"
            size="small"
            severity="secondary"
            [text]="true"
            [disabled]="!canMoveRowUp() || isBusy() || lockedByOther()"
            ariaLabel="Move the row up"
            (onClick)="moveRow(-1)"
          />
          <p-button
            icon="pi pi-arrow-down"
            size="small"
            severity="secondary"
            [text]="true"
            [disabled]="!canMoveRowDown() || isBusy() || lockedByOther()"
            ariaLabel="Move the row down"
            (onClick)="moveRow(1)"
          />
          <p-button
            icon="pi pi-trash"
            size="small"
            severity="secondary"
            [text]="true"
            [disabled]="isBusy() || lockedByOther()"
            ariaLabel="Remove the row"
            (onClick)="askRemoveRow($event)"
          />
        }
      </div>
    }
  </div>
} @else {
  <p class="hint">Click into a cell to edit it, or select a group or row for more actions.</p>
}
