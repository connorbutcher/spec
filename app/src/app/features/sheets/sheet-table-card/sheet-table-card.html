<section class="app-card table-card" [attr.aria-label]="label()">
  <header class="table-head" [class.selected]="isSelected()" (click)="selectTable()">
    @if (canEditTable()) {
      <i
        cdkDragHandle
        class="pi pi-bars handle"
        aria-hidden="true"
        (click)="$event.stopPropagation()"
      ></i>
      <input
        #titleInput
        pInputText
        class="title"
        type="text"
        maxlength="200"
        aria-label="Table title"
        [placeholder]="table().templateName"
        [ngModel]="title()"
        (ngModelChange)="title.set($event)"
        (blur)="rename()"
        (keydown.enter)="titleInput.blur()"
        (keydown.escape)="revertTitle()"
      />
    } @else {
      <h2 class="title title-text">{{ label() }}</h2>
    }
    <span class="meta">{{ table().templateName }} · v{{ table().templateVersionNumber }}</span>
    <app-sheet-status [status]="status()" />
  </header>

  <div class="grid-scroll">
    <app-sheet-grid [table]="table()" />
  </div>
</section>
