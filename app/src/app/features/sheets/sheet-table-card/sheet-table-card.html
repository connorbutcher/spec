<section class="app-card table-card" [attr.aria-label]="label()">
  <header class="table-head" (click)="selectTable()">
    @if (canEditTable()) {
      <input
        #titleInput
        pInputText
        pSize="small"
        class="title"
        type="text"
        maxlength="200"
        aria-label="Table title"
        [placeholder]="table().templateName"
        [value]="table().title ?? ''"
        (change)="rename(titleInput)"
        (click)="$event.stopPropagation()"
      />
    } @else {
      <h2 class="title-text">{{ label() }}</h2>
    }
    <span class="meta">{{ table().templateName }} · v{{ table().templateVersionNumber }}</span>
    @if (table().isPending) {
      <p-tag value="New" severity="secondary" [rounded]="true" />
    }
    @if (lockedBy(); as user) {
      <p-tag
        [value]="'Being edited by ' + user"
        icon="pi pi-lock"
        severity="warn"
        [rounded]="true"
      />
    }

    <span class="spacer"></span>

    @if (canEditTable()) {
      <div
        class="actions"
        role="group"
        aria-label="Table actions"
        (click)="$event.stopPropagation()"
      >
        @for (addable of table().addableSections; track addable.templateSectionId) {
          <p-button
            [label]="addable.name"
            icon="pi pi-plus"
            size="small"
            severity="secondary"
            [outlined]="true"
            [disabled]="!addable.canAdd || isBusy()"
            [ariaLabel]="'Add ' + addable.name"
            (onClick)="addSection(addable.templateSectionId)"
          />
        }
        <p-button
          icon="pi pi-arrow-up"
          size="small"
          severity="secondary"
          [text]="true"
          [disabled]="!canMoveUp() || isBusy()"
          ariaLabel="Move the table up"
          (onClick)="move(-1)"
        />
        <p-button
          icon="pi pi-arrow-down"
          size="small"
          severity="secondary"
          [text]="true"
          [disabled]="!canMoveDown() || isBusy()"
          ariaLabel="Move the table down"
          (onClick)="move(1)"
        />
        <p-button
          icon="pi pi-trash"
          size="small"
          severity="secondary"
          [text]="true"
          [disabled]="isBusy()"
          ariaLabel="Remove the table"
          (onClick)="askRemove($event)"
        />
      </div>
    }
  </header>

  @if (canEdit()) {
    <app-sheet-action-bar [table]="table()" />
  }

  <div class="grid-scroll">
    <app-sheet-grid [table]="table()" />
  </div>
</section>
