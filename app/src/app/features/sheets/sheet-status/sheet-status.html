@if (status().isNew) {
  <p-tag value="New" severity="secondary" />
} @else if (version(); as version) {
  <span class="version app-mono" [class.changed]="changed()">{{ version }}</span>
}

@if (text(); as text) {
  <span class="app-status-tone state" [attr.data-tone]="tone()" [attr.aria-label]="compact() ? text : null">
    <i [class]="icon()" aria-hidden="true"></i>
    @if (!compact()) {
      <span class="app-truncate">{{ text }}</span>
    }
  </span>
}
