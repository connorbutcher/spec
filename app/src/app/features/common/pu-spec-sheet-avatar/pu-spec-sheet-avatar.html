@if (viewers().length > 0) {
  <div class="viewers">
    @for (viewer of viewers(); track viewer.connectionId; let i = $index) {
      <app-avatar
        [avatar]="viewer.username"
        [backgroundColor]="viewer.colour"
        [uid]="viewer.uid"
        [index]="i"
        [size]="size()"
      />
    }
  </div>
}
