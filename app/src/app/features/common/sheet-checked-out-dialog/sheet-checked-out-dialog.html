<div class="dialog-container">
  <div class="dialog-header">
    <span class="dialog-title">{{ title }}</span>
  </div>

  <div class="dialog-content">
    <p class="message">{{ message }}</p>
  </div>

  <div class="dialog-actions">
    <button pButton severity="secondary" (click)="close()">Cancel</button>
    <button pButton severity="primary" (click)="close(false)">
      Continue as read-only
    </button>
    <button pButton severity="primary" (click)="close(true)">
      Request Checkout
    </button>
  </div>
</div>
