<div>
  <div class="label-container">
    <label>{{ labelText() }}</label>

    <div class="spacer"></div>

    <ng-content select="[adornerregion]"></ng-content>

    @if (enableExpansion()) {
      <i
        class="expand-toggle material-symbols-outlined"
        (click)="toggleExpansion()"
        >{{ isExpanded() ? "keyboard_arrow_up" : "keyboard_arrow_down" }}</i
      >
    }

    @if (infoText()) {
      <i class="pi pi-info-circle" [pTooltip]="infoText()"></i>
    }
  </div>

  @if (isExpanded()) {
    <ng-content> </ng-content>
  }
</div>
